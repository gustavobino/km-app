<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#101828;background:#F4F3EE">
  <div style="font-size:28px;font-weight:800;letter-spacing:-0.03em">Km+</div>
  <h2 style="font-size:22px;margin:24px 0 8px">Seu código para entrar</h2>
  <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Digite este código no Km+:</p>
  <div style="font-size:34px;font-weight:800;letter-spacing:0.2em;background:#C6F135;border-radius:16px;padding:16px;text-align:center">{{ .Token }}</div>
  <p style="font-size:15px;line-height:1.5;margin:24px 0 12px">Ou toque no botão para entrar direto:</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#101828;color:#C6F135;font-weight:800;font-size:16px;text-decoration:none;padding:14px 24px;border-radius:16px">Entrar no Km+</a></p>
  <p style="font-size:13px;line-height:1.5;color:#5B6472;margin:0">O código e o link valem por 1 hora e só podem ser usados uma vez. Se você não pediu para entrar, pode ignorar este e-mail.</p>
</div>
