<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Registrar o dia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input,button{font-family:inherit;color:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #101828;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F3EE;font-family:Manrope,system-ui,sans-serif;color:#101828;display:flex;flex-direction:column;overflow:hidden">
  <main style="flex:1;min-height:0;padding:24px 20px 14px;display:flex;flex-direction:column;gap:12px">
    <header>
      <div style="font-size:13px;font-weight:600;color:#5B6472">Segunda, 23 de novembro</div>
      <h1 style="margin:4px 0 0;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-0.03em">Como foi o dia?</h1>
    </header>

    <section style="background:#fff;border:1px solid #E6E3DA;border-radius:20px;padding:0 16px">
      <div style="padding:14px 0 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6472">Ganhos do dia</div>
      <div style="display:flex;align-items:center;gap:12px;height:52px;border-top:1px solid #EEEBE3">
        <span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:#101828;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">U</span>
        <label for="uber" style="flex:1;font-weight:700;font-size:16px">Uber</label>
        <span aria-hidden="true" style="color:#5B6472;font-weight:600">R$</span>
        <input id="uber" inputmode="decimal" value="{{uber}}" onChange="{{setUber}}" style="width:96px;border:0;background:transparent;text-align:right;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:22px;font-weight:800;padding:8px 0">
      </div>
      <div style="display:flex;align-items:center;gap:12px;height:52px;border-top:1px solid #EEEBE3">
        <span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:#EAE8E0;color:#101828;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">99</span>
        <label for="n99" style="flex:1;font-weight:700;font-size:16px">99</label>
        <span aria-hidden="true" style="color:#5B6472;font-weight:600">R$</span>
        <input id="n99" inputmode="decimal" value="{{n99}}" onChange="{{set99}}" style="width:96px;border:0;background:transparent;text-align:right;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:22px;font-weight:800;padding:8px 0">
      </div>
      <div style="display:flex;align-items:center;gap:12px;height:52px;border-top:1px solid #EEEBE3">
        <span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:#EAE8E0;color:#101828;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">+</span>
        <label for="outro" style="flex:1;font-weight:700;font-size:16px">Outro app</label>
        <span aria-hidden="true" style="color:#5B6472;font-weight:600">R$</span>
        <input id="outro" inputmode="decimal" value="{{outro}}" onChange="{{setOutro}}" style="width:96px;border:0;background:transparent;text-align:right;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:22px;font-weight:800;padding:8px 0">
      </div>
    </section>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div style="background:#fff;border:1px solid #E6E3DA;border-radius:20px;padding:12px 16px">
        <label for="horas" style="display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6472">Horas rodadas</label>
        <div style="display:flex;align-items:baseline;gap:6px">
          <input id="horas" inputmode="decimal" value="{{horas}}" onChange="{{setHoras}}" style="width:70px;border:0;background:transparent;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:28px;font-weight:800;padding:4px 0">
          <span aria-hidden="true" style="color:#5B6472;font-weight:700">h</span>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #E6E3DA;border-radius:20px;padding:12px 16px">
        <label for="km" style="display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6472">Km rodados</label>
        <div style="display:flex;align-items:baseline;gap:6px">
          <input id="km" inputmode="numeric" value="{{km}}" onChange="{{setKm}}" style="width:70px;border:0;background:transparent;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:28px;font-weight:800;padding:4px 0">
          <span aria-hidden="true" style="color:#5B6472;font-weight:700">km</span>
        </div>
      </div>
    </div>

    <section style="background:#fff;border:1px solid #E6E3DA;border-radius:20px;padding:14px 16px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6472">Gastos do dia</span>
        <span style="font-size:12px;font-weight:700;color:#5B6472;background:#F4F3EE;border-radius:10px;padding:3px 10px">opcional</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" aria-label="Remover Combustível, R$ 85,00" style="height:44px;padding:0 14px;border:0;border-radius:22px;background:#101828;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px">Combustível · 85,00
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button type="button" aria-label="Remover Alimentação, R$ 22,00" style="height:44px;padding:0 14px;border:0;border-radius:22px;background:#101828;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px">Alimentação · 22,00
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button type="button" style="height:44px;padding:0 14px;border:1.5px solid #CFCCC0;border-radius:22px;background:#fff;font-size:14px;font-weight:700">+ Pedágio</button>
        <button type="button" style="height:44px;padding:0 14px;border:1.5px solid #CFCCC0;border-radius:22px;background:#fff;font-size:14px;font-weight:700">+ Outro</button>
      </div>
    </section>

    <section aria-live="polite" style="margin-top:auto;box-sizing:border-box;height:68px;background:#C6F135;color:#101828;border-radius:22px;padding:0 18px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:12px;font-weight:800;color:#26340A">Sobrou no bolso hoje</div>
        <div style="font-size:13px;font-weight:600;color:#26340A">{{ganhoHoraTxt}}</div>
      </div>
      <div style="font-family:'Bricolage Grotesque',Manrope,sans-serif;font-weight:800;letter-spacing:-0.035em;font-size:32px;line-height:1;color:#101828">{{sobrouTxt}}</div>
    </section>
    <button type="button" style="height:52px;border:0;border-radius:16px;background:#101828;color:#C6F135;font-size:17px;font-weight:800">Fechar o dia</button>
  </main>

  <nav aria-label="Navegação principal" style="height:76px;box-sizing:border-box;background:#fff;border-top:1px solid #E6E3DA;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 8px 0">
    <a href="Main.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#101828">
      <span style="width:56px;height:30px;border-radius:15px;background:#101828;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Registrar</a>
    <a href="Painel.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#5B6472">
      <span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Painel</a>
    <a href="Simulador.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#5B6472">
      <span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></span>Simulador</a>
    <a href="Insights.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#5B6472">
      <span style="width:56px;height:30px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>Insights</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { uber: '212,50', n99: '98,00', outro: '40,00', horas: '8,5', km: '142' };
  }
  num(s) {
    const n = parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  fmt(n) {
    return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  renderVals() {
    const s = this.state;
    const total = this.num(s.uber) + this.num(s.n99) + this.num(s.outro);
    const h = this.num(s.horas);
    return {
      uber: s.uber, n99: s.n99, outro: s.outro, horas: s.horas, km: s.km,
      setUber: (e) => this.setState({ uber: e.target.value }),
      set99: (e) => this.setState({ n99: e.target.value }),
      setOutro: (e) => this.setState({ outro: e.target.value }),
      setHoras: (e) => this.setState({ horas: e.target.value }),
      setKm: (e) => this.setState({ km: e.target.value }),
      sobrouTxt: 'R$ ' + this.fmt(total - 107),
      ganhoHoraTxt: h > 0 ? 'R$ ' + this.fmt(total / h) + ' por hora' : 'informe as horas'
    };
  }
}
</script>
</body>
</html>
