# Weekly encrypted backup of the Supabase database (free: GitHub Actions).
# The dump is encrypted with BACKUP_PASSPHRASE before upload, because the
# repository is public and artifacts can be downloaded by anyone who can see it.
# Restore instructions: docs/backup.md
name: Database backup

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (03:17 in São Paulo)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing secret SUPABASE_DB_URL"; exit 1; }
          test ${#BACKUP_PASSPHRASE} -ge 16 || { echo "::error::BACKUP_PASSPHRASE missing or shorter than 16 characters"; exit 1; }

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          PG=/usr/lib/postgresql/17/bin
          STAMP=$(date -u +%Y-%m-%d)
          mkdir -p work
          # App tables (schema + data) and the login accounts they belong to.
          "$PG/pg_dump" "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -f work/public.sql
          "$PG/pg_dump" "$SUPABASE_DB_URL" --data-only --table=auth.users --table=auth.identities -f work/auth-users.sql
          tar -czf work/backup.tar.gz -C work public.sql auth-users.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            -o "kmplus-backup-$STAMP.tar.gz.gpg" work/backup.tar.gz 3<<<"$BACKUP_PASSPHRASE"
          rm -rf work
          ls -l kmplus-backup-*.gpg
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: kmplus-backup-${{ env.STAMP }}
          path: kmplus-backup-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
